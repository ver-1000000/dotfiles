# User customizations
# `hyprland.conf` no autogen default ha narubeku sono mama nokoshi,
# jibun no sashiire dake wo koko ni matomeru

$mainMod = SUPER

###################
### Applications ###
###################

$terminal = ghostty
$menu = rofi -show run
plugin = /home/akai/.config/hypr/hyprstack.so

#################
### Autostart ###
#################

exec-once = fcitx5 -d
exec-once = mako
exec-once = waybar
exec-once = sh -c 'sleep 1; ~/.config/hypr/toggle-stack-mode.sh; ~/.config/hypr/toggle-stack-mode.sh'

################
### Monitors ###
################

monitor = HDMI-A-1,1920x1080@60,0x0,1
monitor = HDMI-A-2,1920x1080@60,1920x0,1

#############
### Input ###
#############

input {
    kb_layout = jp
    follow_mouse = 0
}

###############
### Layouts ###
###############

general {
    layout = monocle
    gaps_out = 10
}

###################
### Decoration ###
###################

decoration {
    rounding = 4
}

############################
### Floating Experiment ###
############################

# Stage 1: zenbu no window wo kasanete tsukau jikken
# hyprstack-mode:begin float-all-windows
windowrule {
    name = float-all-windows
    match:class = .*

    float = yes
    center = yes
}
# hyprstack-mode:end float-all-windows

windowrule = match:class com.mitchellh.ghostty, opacity 0.9 0.7
windowrule = match:class com.mitchellh.ghostty, no_blur on

###################
### Keybindings ###
###################

# Unbind defaults we explicitly replace
unbind = $mainMod, Q
unbind = $mainMod, C
unbind = $mainMod, M
unbind = $mainMod, J
unbind = $mainMod, R

# awesome like: Super + Enter
bind = $mainMod, RETURN, exec, $terminal

# awesome like: Super + Ctrl + R
bind = CTRL $mainMod, R, exec, hyprctl reload

# awesome like: Super + R
bind = $mainMod, R, exec, $menu

# awesome like: Super + Shift + Q
bind = SHIFT $mainMod, Q, exit,

# awesome like: Super + Shift + C
bind = SHIFT $mainMod, C, killactive,

# Screenshot
bind = , PRINT, exec, sh -c 'grim -g "$(slurp)" "$HOME/Downloads/$(date +%Y%m%d%H%M%S).png"'
bind = SHIFT, PRINT, exec, sh -c 'grim -g "$(slurp)" - | wl-copy'

# awesome like: Super + Tab
bind = $mainMod, TAB, stackfocus, last

# awesome like: Super + Shift + Tab
bind = SHIFT $mainMod, TAB, exec, toggle-tablet-monitors

# awesome like: Super + Ctrl + Tab
bind = CTRL $mainMod, TAB, focusmonitor, +1

# awesome like: Super + T / Super + M
bind = $mainMod, T, pin, active
bind = $mainMod, M, fullscreen, 1

# awesome like: Super + Space
bind = $mainMod, SPACE, exec, ~/.config/hypr/toggle-stack-mode.sh

# vim-like focus movement
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, stackfocus, next
bind = $mainMod, K, stackfocus, prev
bind = $mainMod, L, movefocus, r

# vim-like window movement / stack reorder
bind = SHIFT $mainMod, H, movewindow, l
bind = SHIFT $mainMod, J, stackswap, next
bind = SHIFT $mainMod, K, stackswap, prev
bind = SHIFT $mainMod, L, movewindow, r

# awesome like: move active window to next monitor
bind = $mainMod, O, movewindow, mon:+1
